services:
  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ollama
      - redis_db
  db:
    image: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./.ollama_models:/root/.ollama
  redis_db:
    image: redis
    ports:
      - "6379:6379"



