services:
  backend:
    build: .
    env_file:
      - .env
#    ports:
#      - 127.0.0.1:8000:8000 # Linux
    expose:
      - "8000"
    depends_on:
      - postgres_db
      - ollama
      - redis_db
    volumes:
      - ./migrations/versions:/chatjpg/migrations/versions
      - ./src/files:/chatjpg/src/files
  postgres_db:
    image: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/18/docker
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./.ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
  redis_db:
    image: redis
    ports:
      - "6379:6379"
  nginx:
    image: nginx:latest
#    network_mode: "host" # Linux
#    extra_hosts:
#      - "backend:127.0.0.1"
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend



